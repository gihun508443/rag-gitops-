apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-agent
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/gihun508443/rag-agent-helm.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: practice

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
